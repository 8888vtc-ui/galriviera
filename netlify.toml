[build]
  publish = "dist"
  command = "npm run build"
  base = "."

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://api.openai.com https://api.x.ai; frame-ancestors 'none';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/chauffeur-prive-parlant-hebreu-nice"
  to = "/chauffeur-prive-nice/"
  status = 301

[[redirects]]
  from = "/chauffeur-prive-parlant-hebreu-nice/"
  to = "/chauffeur-prive-nice/"
  status = 301

[[redirects]]
  from = "/en/hebrew-speaking-driver-nice"
  to = "/en/private-chauffeur-nice/"
  status = 301

[[redirects]]
  from = "/en/hebrew-speaking-driver-nice/"
  to = "/en/private-chauffeur-nice/"
  status = 301
